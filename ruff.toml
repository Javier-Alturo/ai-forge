# Ruff config for AI-Forge (overrides any global user config).
target-version = "py311"
line-length = 120
extend-exclude = ["pruebas", "knowledge", "agents/dynamic_tools_history", "data", "outputs"]

[lint]
select = [
    "E4", "E7", "E9", "F",   # pyflakes + core pycodestyle errors
    "BLE001",                # blind `except Exception` without logging/re-raise
    "S110",                  # try-except-pass
    "S608",                  # SQL built with string formatting
    "B904",                  # raise inside except without `from`
    "C901",                  # cyclomatic complexity
]
# E402: the repo intentionally bootstraps sys.path / load_dotenv before local imports.
ignore = ["E402"]

[lint.mccabe]
max-complexity = 10

[lint.per-file-ignores]
"tests/**" = ["S110"]
