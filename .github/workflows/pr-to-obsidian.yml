name: PR to Obsidian

on:
  pull_request:
    types:
      - closed

jobs:
  generate_obsidian_doc:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate PR Document
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }} # Necesario para el resumen
        run: python .github/scripts/generate_pr_doc.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge/prs/
          # Si no hay cambios, exit 0
          git diff --staged --quiet || (git commit -m "docs: Auto-generar nota de Obsidian para PR #${{ github.event.pull_request.number }}" && git push)
